name: Build and Release Chrome App-Bound Encryption Decryption

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build for x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile SQLite (x64)
        shell: cmd
        run: |
          echo "Compiling SQLite for x64"
          cl /nologo /W3 /O2 /MT /c libs\sqlite\sqlite3.c /Fo"sqlite3_x64.obj"
          lib /nologo /OUT:"sqlite3_x64.lib" "sqlite3_x64.obj"
          if not exist "sqlite3_x64.lib" exit 1
          echo "SQLite compilation finished"

      - name: Compile chrome_decrypt.dll (x64)
        shell: cmd
        run: |
          echo "Compiling chrome_decrypt.dll for x64"
          cl /EHsc /std:c++17 /LD /O2 /MT /Ilibs\sqlite src\chrome_decrypt.cpp src\reflective_loader.c "sqlite3_x64.lib" bcrypt.lib ole32.lib oleaut32.lib shell32.lib version.lib comsuppw.lib /link /OUT:"chrome_decrypt_x64.dll"
          if not exist "chrome_decrypt_x64.dll" (
            echo "Error: chrome_decrypt_x64.dll not found!"
            dir .
            exit 1
          )
          echo "chrome_decrypt.dll compilation finished"

      - name: Compile resource script
        shell: cmd
        run: |
          echo "Compiling resource.rc"
          echo CHROME_DECRYPT_DLL RCDATA "chrome_decrypt_x64.dll" > resource.rc
          dir chrome_decrypt_x64.dll
          rc /v resource.rc
          if not exist "resource.res" (
            echo "Error: resource.res not found!"
            dir .
            exit 1
          )
          echo "Resource compilation finished"

      - name: Compile chrome_inject.exe (x64)
        shell: cmd
        run: |
          echo "Compiling chrome_inject.exe for x64"
          cl /EHsc /O2 /std:c++17 /MT src\chrome_inject.cpp version.lib shell32.lib resource.res /link /OUT:"chrome_inject_x64.exe"
          if not exist "chrome_inject_x64.exe" (
            echo "Error: chrome_inject_x64.exe not found!"
            dir .
            exit 1
          )
          echo "chrome_inject.exe compilation finished"

      - name: Create Artifacts Directory
        run: mkdir staging

      - name: Move artifacts to staging
        shell: cmd
        run: |
          move "chrome_inject_x64.exe" staging\
          echo "Moved chrome_inject_x64.exe to staging"

      - name: Upload build artifacts (x64)
        uses: actions/upload-artifact@v4
        with:
          name: chrome-decryptor-binaries-x64
          path: staging/

  create_release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x64 binaries
        uses: actions/download-artifact@v4
        with:
          name: chrome-decryptor-binaries-x64
          path: release_assets/x64

      - name: List downloaded files
        run: |
          echo "--- Listing contents of release_assets ---"
          ls -R release_assets
          echo "------------------------------------------"

      - name: Create ZIP archive
        id: zip_packages
        shell: bash
        run: |
          VERSION_TAG=${{ github.ref_name }}
          VERSION_NUM=${VERSION_TAG#v}
          mkdir -p release_packages
          X64_ZIP_NAME="chrome-decryptor-${VERSION_NUM}-x64.zip"
          echo "Zipping x64 assets..."
          if [ ! -f "release_assets/x64/chrome_inject_x64.exe" ]; then
            echo "Error: x64 binary missing!"
            ls -l release_assets/x64
            exit 1
          fi
          (cd release_assets/x64 && zip "../../release_packages/${X64_ZIP_NAME}" chrome_inject_x64.exe)
          echo "x64_zip_path=release_packages/${X64_ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for version ${{ github.ref_name }}.
            Contains x64 binary:
            - chrome_inject_x64.exe with embedded chrome_decrypt.dll
          draft: false
          prerelease: false
          files: |
            ${{ steps.zip_packages.outputs.x64_zip_path }}
          fail_on_unmatched_files: true
